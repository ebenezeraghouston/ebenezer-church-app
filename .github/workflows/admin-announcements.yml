name: Send Admin Announcements
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-announcements
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install firebase-admin
      - name: Send queued administrator announcements
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/send_admin_announcements.py
