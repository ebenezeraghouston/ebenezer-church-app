
name: Church Event Reminders (Day Before and Day Of)

on:
  schedule:
    - cron: '2-59/5 * * * *'

  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test push notification immediately'
        required: true
        type: boolean
        default: false

      dry_run:
        description: 'Preview reminders without sending notifications'
        required: true
        type: boolean
        default: true

      preview_date:
        description: 'Optional preview date (YYYY-MM-DD)'
        required: false
        type: string

      preview_time:
        description: 'Optional Houston local time (HH:MM)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: church-event-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Show Houston local time
        env:
          TZ: America/Chicago
        run: echo "Houston time $(date)"

      - name: Preview or send reminders
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
          PREVIEW_DATE: ${{ github.event.inputs.preview_date }}
          PREVIEW_TIME: ${{ github.event.inputs.preview_time }}
        run: |
          args=()

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SEND_TEST" == "true" ]]; then
            args+=(--send-test)
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "false" ]]; then
            args+=(--dry-run)
          fi

          if [[ -n "$PREVIEW_DATE" ]]; then
            args+=(--date "$PREVIEW_DATE")
          fi

          if [[ -n "$PREVIEW_TIME" ]]; then
            args+=(--preview-time "$PREVIEW_TIME")
          fi

          python scripts/send_event_reminders.py "${args[@]}"

      - name: Publish notification history
        if: success()
        run: |
          if [[ -z "$(git status --porcelain -- notifications.json)" ]]; then
            echo "No notification history changes."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add notifications.json
          git commit -m 'Archive sent church notifications'

          for attempt in 1 2 3 4 5; do
            echo "Publishing attempt $attempt of 5"

            if git push origin HEAD:main; then
              echo "Notification history published successfully."
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            sleep $((attempt * 10))

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Notification history merge conflict."
              exit 1
            fi
          done

          echo "::error::Unable to publish notification history after 5 attempts."
          exit 1
